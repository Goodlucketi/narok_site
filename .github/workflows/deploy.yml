name: Build and Deploy Vite App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # Use PAT for push

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build the Vite app
      - name: Build
        run: npm run build

      # 5️⃣ Deploy to deploy branch
      - name: Deploy to deploy branch
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}  # Use the working token
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git reset --hard

          git fetch origin deploy
          git checkout deploy || git checkout -b deploy

          git ls-files -z | xargs -0 git rm -f || echo "No files to remove"
          cp -r dist/* .

          git add .
          git commit -m "Deploy build" || echo "No changes to commit"

          git remote set-url origin https://$PAT_TOKEN@github.com/Goodlucketi/narok_site.git
          git push origin deploy --force
