name: Debug Vite Build Output

on:
  push:
    branches:
      - main

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2️⃣ Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Show repo structure BEFORE install
      - name: Debug – repo structure (before install)
        run: |
          echo "PWD:"
          pwd
          echo "Root contents:"
          ls -la

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5️⃣ Show repo structure AFTER install
      - name: Debug – repo structure (after install)
        run: |
          echo "Root contents:"
          ls -la

      # 6️⃣ Run build
      - name: Build Vite app
        run: npm run build

      # 7️⃣ DEBUG – locate build output
      - name: Debug – locate build output
        run: |
          echo "========== AFTER BUILD =========="
          echo "Root contents:"
          ls -la

          echo ""
          echo "dist folder:"
          ls -la dist || echo "❌ dist folder NOT found"

          echo ""
          echo "build folder:"
          ls -la build || echo "❌ build folder NOT found"

          echo ""
          echo "Searching for index.html:"
          find . -name index.html -type f

          echo ""
          echo "vite.config.js (if exists):"
          cat vite.config.* || echo "No vite config found"
