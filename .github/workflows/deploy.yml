- name: Deploy to deploy branch
  env:
    PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  run: |
    git config --global user.name "github-actions"
    git config --global user.email "github-actions@github.com"

    git reset --hard
    git fetch origin deploy
    git checkout deploy || git checkout -b deploy

    # Remove old files
    git ls-files -z | xargs -0 git rm -f || echo "No files to remove"

    # Debug: confirm dist exists
    echo "Listing current directory:"
    ls -la
    echo "Listing build folder:"
    ls -la dist || echo "dist folder not found!"

    # Copy build output (update folder if needed)
    cp -r dist/* .

    git add .
    git commit -m "Deploy build" || echo "No changes to commit"

    git remote set-url origin https://$PAT_TOKEN@github.com/Goodlucketi/narok_site.git
    git push origin deploy --force
