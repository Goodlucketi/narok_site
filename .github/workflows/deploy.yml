name: Build and Deploy Vite App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # Important to use PAT

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build Vite app
      - name: Build
        run: npm run build

      - name: Debug build folder
        run: |
          echo "Current directory:"
          pwd
          echo "Contents of repo root:"
          ls -la
          echo "Checking for dist folder:"
          ls -la dist || echo "dist folder missing"
          echo "Checking for build folder:"
          ls -la build || echo "build folder missing"


      # 6️⃣ Deploy to deploy branch
      - name: Deploy to deploy branch
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git reset --hard
          git fetch origin deploy
          git checkout deploy || git checkout -b deploy

          # Remove old files safely
          git ls-files -z | xargs -0 git rm -f || echo "No files to remove"

          # Copy build output dynamically
          BUILD_DIR="${{ steps.build_folder.outputs.build_dir }}"
          echo "Copying files from $BUILD_DIR"
          cp -r "$BUILD_DIR"/* .

          git add .
          git commit -m "Deploy build" || echo "No changes to commit"

          # Use PAT for push
          git remote set-url origin https://$PAT_TOKEN@github.com/Goodlucketi/narok_site.git
          git push origin deploy --force
