name: Build and Deploy Vite App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout main
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build
      - name: Build
        run: npm run build

      # 5️⃣ Preserve build output BEFORE switching branches
      - name: Preserve build output
        run: |
          mkdir /tmp/deploy-build
          cp -r dist/* /tmp/deploy-build/

      # 6️⃣ Deploy to deploy branch
      - name: Deploy
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -e

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git fetch origin deploy || true
          git checkout deploy || git checkout --orphan deploy

          # Clean deploy branch completely
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Restore build output
          cp -r /tmp/deploy-build/* .

          git add .
          git commit -m "Deploy build" || echo "No changes to commit"

          git remote set-url origin https://$PAT_TOKEN@github.com/Goodlucketi/narok_site.git
          git push origin deploy --force
