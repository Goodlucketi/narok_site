name: Build and Deploy Vite App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout main branch
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build Vite app
      - name: Build
        run: npm run build

      # 5️⃣ Deploy build to deploy branch
      - name: Deploy to deploy branch
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -e

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Ensure deploy branch exists
          git fetch origin deploy || true
          git checkout deploy || git checkout --orphan deploy

          # Remove everything except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy build output
          cp -r dist/* .

          # Commit and push
          git add .
          git commit -m "Deploy build" || echo "No changes to commit"

          git remote set-url origin https://$PAT_TOKEN@github.com/Goodlucketi/narok_site.git
          git push origin deploy --force
