name: Build and Deploy Vite App

on:
  push:
    branches:
      - main  # Trigger workflow on push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important to get all branches

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build the Vite app
      - name: Build
        run: npm run build

      # 5️⃣ Deploy to deploy branch
      - name: Deploy to deploy branch
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}  # Use the working token
        run: |
          # Configure git
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Reset any local changes from build
          git reset --hard

          # Fetch deploy branch and switch (create if missing)
          git fetch origin deploy
          git checkout deploy || git checkout -b deploy

          # Remove old tracked files safely
          git ls-files -z | xargs -0 git rm -f || echo "No files to remove"

          # Copy built files
          cp -r dist/* .

          # Commit changes (skip if nothing changed)
          git add .
          git commit -m "Deploy build" || echo "No changes to commit"

          # Use PAT for push
          git remote set-url origin https://$PAT_TOKEN@github.com/Goodlucketi/narok_site.git
          git push origin deploy --force
